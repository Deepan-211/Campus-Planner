  name: "V.S.B. Engineering College"
  city: "Karur, Tamil Nadu"
  bbox:
    north: 10.9590
    south: 10.9510
    west: 77.9500
    east: 77.9590
  graph_cache_path: "config/campuses/vsb_karur/campus_graph.graphml"
