campus:
  name: "UC Berkeley"
  city: "Berkeley, CA"
  bbox:
    north: 37.8765
    south: 37.8650
    west: -122.2660
    east: -122.2500
  graph_cache_path: "config/campus_graph.graphml"
  travel_matrix_cache_path: "config/travel_matrices.json"

fleet:
  total_bikes: 100
  stands_config_path: "config/stands.json"

simulation:
  operating_hours:
    start_hour: 7
    end_hour: 22
  bike_speed_kmh: 12.0
  walk_speed_kmh: 4.8
  max_wait_minutes: 5.0
  bell_window_minutes: 10
  trip_duration_model: "lognormal"
  trip_duration_variance: 0.15

allocation:
  weights:
    stockout_penalty: 1.0
    overflow_penalty: 0.7
  target_hour: 7

rebalancing:
  van_capacity: 15
  time_per_bike_sec: 90
  max_shift_minutes: 90
  window_start_hour: 11.5
  window_end_hour: 13.0
  num_vans: 1
  depot_stand_id: "ST-07"

weather:
  api_url: "https://api.open-meteo.com/v1/forecast"
  latitude: 37.8719
  longitude: -122.2585
  cache_db_path: "data/weather_cache.db"
  cache_ttl_hours: 24
  rain_penalty_factor: 0.50

evaluation:
  replications: 30
  confidence_interval_level: 0.95
  random_seeds: [42, 101, 202, 303, 404, 505, 606, 707, 808, 909, 1010, 1111, 1212, 1313, 1414, 1515, 1616, 1717, 1818, 1919, 2020, 2121, 2222, 2323, 2424, 2525, 2626, 2727, 2828, 2929]

